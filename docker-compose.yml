services:
  postgres:
    image: postgres:16-alpine
    container_name: advdb-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: advdb
    ports:
      - "5433:5432"   # host 5433 to avoid clashing with a local postgres on 5432
    volumes:
      - advdb_pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "log_min_duration_statement=200"   # slow-query log, see docs/07
      - "-c"
      - "track_io_timing=on"               # richer EXPLAIN (ANALYZE, BUFFERS) output

volumes:
  advdb_pgdata:
